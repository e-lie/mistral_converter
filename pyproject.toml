[project]
name = "mistral-converter"
version = "0.1.2"
description = "Convert PDF ebooks to Markdown with the Mistral OCR API"
requires-python = ">=3.10"
dependencies = [
    "ebooklib>=0.20",
    "markdown-it-py>=4.2.0",
    "mistralai",
]

[project.scripts]
mistral-converter = "mistral_converter.cli:main"

[project.optional-dependencies]
web = [
    "fastapi",
    "jinja2",
    "python-multipart",
    "uvicorn",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.setuptools.package-data]
"mistral_converter.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
